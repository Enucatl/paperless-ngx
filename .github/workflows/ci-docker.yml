name: Docker Build
on:
  push:
    branches: [dev]
  workflow_dispatch:
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    uses: ./.github/workflows/ci-backend.yml
  frontend:
    uses: ./.github/workflows/ci-frontend.yml
  lint:
    uses: ./.github/workflows/ci-lint.yml
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql-analysis.yml
  static-analysis:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/ci-static-analysis.yml
  version:
    if: github.repository == 'Enucatl/paperless-ngx'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ format('{0}-nano-{1}', steps.version.outputs.base_tag, steps.version.outputs.short_sha) }}
    steps:
      - name: Checkout with upstream tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch current upstream tags
        run: git fetch --tags https://github.com/paperless-ngx/paperless-ngx.git dev
      - name: Read upstream version and fork revision
        id: version
        uses: Enucatl/docker-compose-security-baseline/.github/actions/git-version@main
  publish:
    needs: [backend, frontend, lint, codeql, static-analysis, version]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: Enucatl/docker-compose-security-baseline/.github/workflows/docker-ci.yml@main
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}
    with:
      image_name: ghcr.io/enucatl/paperless-ngx
      platforms: linux/amd64
      push: true
      version: ${{ needs.version.outputs.tag }}
      meta_tags: |
        type=raw,value=${{ needs.version.outputs.tag }}
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}
      build_args: PNGX_TAG_VERSION=dev
      trivy_skip_dirs: .devcontainer
